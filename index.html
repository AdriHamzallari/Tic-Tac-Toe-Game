<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .game-info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .current-player {
      font-size: 1.3em;
      color: #666;
      margin-bottom: 10px;
    }

    .player-turn {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 30px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .square {
      background: white;
      border: 4px solid #667eea;
      border-radius: 10px;
      aspect-ratio: 1;
      font-size: 3em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #667eea;
      min-height: 100px;
    }

    .square:hover:not(.taken) {
      background: #f0f0ff;
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    .square:active:not(.taken) {
      transform: scale(0.95);
    }

    .square.taken {
      cursor: not-allowed;
    }

    .square.X {
      color: #667eea;
    }

    .square.O {
      color: #764ba2;
    }

    .result-container {
      min-height: 80px;
      margin-bottom: 20px;
    }

    .result-message {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .result-message.win {
      color: #28a745;
      background: #d4edda;
    }

    .result-message.draw {
      color: #ffc107;
      background: #fff3cd;
    }

    .result-message.hidden {
      display: none;
    }

    .controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1.1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .reset-btn {
      background: #dc3545;
      color: white;
    }

    .reset-btn:hover {
      background: #c82333;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
    }

    .mode-btn {
      background: #667eea;
      color: white;
    }

    .mode-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .score-board {
      display: flex;
      justify-content: space-around;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .score-item {
      text-align: center;
    }

    .score-label {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score-value {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }

    @media (max-width: 500px) {
      .game-container {
        padding: 20px;
      }

      h1 {
        font-size: 2em;
      }

      .square {
        font-size: 2.5em;
        min-height: 80px;
      }

      .btn {
        padding: 12px 24px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>⭕ Tic-Tac-Toe ❌</h1>

    <div class="score-board">
      <div class="score-item">
        <div class="score-label">Player X</div>
        <div class="score-value" id="score-x">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">Draws</div>
        <div class="score-value" id="score-draws">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">Player O</div>
        <div class="score-value" id="score-o">0</div>
      </div>
    </div>

    <div class="game-info">
      <div class="current-player">Current Player:</div>
      <div class="player-turn" id="player-turn">X</div>
    </div>

    <div class="board" id="board">
      <div class="square" data-index="0"></div>
      <div class="square" data-index="1"></div>
      <div class="square" data-index="2"></div>
      <div class="square" data-index="3"></div>
      <div class="square" data-index="4"></div>
      <div class="square" data-index="5"></div>
      <div class="square" data-index="6"></div>
      <div class="square" data-index="7"></div>
      <div class="square" data-index="8"></div>
    </div>

    <div class="result-container">
      <div class="result-message hidden" id="result-message">
        Player X Wins! 🎉
      </div>
    </div>

    <div class="controls">
      <button class="btn reset-btn" id="reset-btn">Reset Game</button>
      <button class="btn mode-btn" id="mode-btn">VS Computer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
